services:
  relying-party-admin-tool-frontend:
    container_name: relying-party-admin-tool-frontend
    build:
      context: .
      dockerfile: local.Dockerfile
    ports:
      - "6001:6001"
      - "9240:9230"
      - "9229:9229"
    volumes:
      - ./:/app
    environment:
      - DEBUG=express-session
      - ENVIRONMENT=${ENVIRONMENT}
      - SESSION_SECRET=${SESSION_SECRET}
    restart: on-failure
