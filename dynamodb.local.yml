services:
  dynamodb-local-rpat:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local-rpat
    ports:
      - "8001:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    environment:
      AWS_ACCESS_KEY_ID: "DUMMYIDEXAMPLE" # pragma: allowlist secret
      AWS_SECRET_ACCESS_KEY: "DUMMYEXAMPLEKEY" # pragma: allowlist secret
