name: build and deploy dev

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./node

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.DEV_GH_ACTIONS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Upload to ECR and tag
        uses: govuk-one-login/devplatform-upload-action-ecr@fba7a3f15d06c6abe52acb3c80cd0882180ea563 # v1.6.0
        with:
          role-to-assume-arn: ${{ secrets.DEV_GH_ACTIONS_ROLE_ARN  }}
          container-sign-kms-key-arn: ${{ secrets.DEV_CONTAINER_SIGN_KMS_KEY }}
          working-directory: ./
          docker-build-path: ./
          ecr-repo-name: ${{ secrets.DEV_ECR_REPOSITORY }}
          artifact-bucket-name: ${{ secrets.DEV_ARTIFACT_SOURCE_BUCKET_NAME }}
