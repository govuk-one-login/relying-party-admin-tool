name: Validation

permissions: {}

on:
  pull_request:
  merge_group:

jobs:
  validation-checks:
    permissions:
      contents: read
    name: Validation checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Get pre-commit python version
        id: get-python-version
        run: |
          RAW_VERSION=$(yq '.default_language_version.python' .pre-commit-config.yaml)
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/[a-zA-Z]//g')
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.get-python-version.outputs.version }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v 6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.github/workflows/validation.yml') }}-${{ runner.os }}

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
